name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v6

      - name: 패키지 설치 (uv.lock 그대로)
        run: uv sync --locked

      - name: 테스트 실행
        run: uv run pytest